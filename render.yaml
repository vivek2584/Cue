databases:
  - name: cue-db
    databaseName: cuedb
    user: cue
    plan: free

services:
  - type: redis
    name: cue-redis
    plan: free
    ipAllowList: [] # internal traffic only

  - type: web
    name: cue-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install && npx prisma generate && npx prisma db push && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cue-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false # You will enter this in the Render dashboard
      - key: GROQ_API_KEY
        sync: false # You will enter this in the Render dashboard
      - key: PORT
        value: "4000"
